[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-s3-lifecycle-audit"
version = "0.1.0"
description = "Report the S3 lifecycle rules your buckets are missing, with the bytes and the monthly dollars behind each one"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "s3", "lifecycle", "finops", "audit", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
aws-s3-lifecycle-audit = "aws_s3_lifecycle_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-s3-lifecycle-audit"
Issues = "https://github.com/moveeeax/aws-s3-lifecycle-audit/issues"

[tool.setuptools]
packages = ["aws_s3_lifecycle_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
