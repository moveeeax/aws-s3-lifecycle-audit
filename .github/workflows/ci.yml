name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Test
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Ruff
        run: ruff check .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Report the bundled snapshot
        run: aws-s3-lifecycle-audit --input examples/snapshot.json

      - name: Exit 1 when a selected rule fires
        run: |
          set +e
          aws-s3-lifecycle-audit --input examples/snapshot.json --fail-on no-abort-mpu
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: Exit 0 when nothing selected fires
        run: |
          aws-s3-lifecycle-audit --input examples/snapshot.json \
            --ignore-rule no-abort-mpu --fail-on no-abort-mpu

      - name: Emit lifecycle fixes
        run: |
          aws-s3-lifecycle-audit --input examples/snapshot.json --emit-lifecycle ./fixes
          test -f ./fixes/build-artifacts.json
          cat ./fixes/build-artifacts.json

      - name: Emit merged lifecycle fixes, JSON and Terraform
        run: |
          aws-s3-lifecycle-audit --input examples/snapshot.json --emit-lifecycle ./merged --merge
          python -c "import json; ids=[r['ID'] for r in json.load(open('merged/access-logs.json'))['Rules']]; assert ids[:2]==['archive-old-logs','expire-old-versions'], ids"
          aws-s3-lifecycle-audit --input examples/snapshot.json --emit-lifecycle ./merged-tf \
            --merge --emit-format terraform
          test -f ./merged-tf/access-logs.tf
          cat ./merged-tf/access-logs.tf
